// Navigateurs anciens : roundRect n'existe que depuis 2022-2023.
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hypot = Math.hypot;
function mulberry32(seed) {
  let a = seed >>> 0;
  return {
    nextFloat() {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    },
    nextInt(n) { return Math.floor(this.nextFloat() * n); },
    nextBoolean() { return this.nextFloat() < 0.5; }
  };
}
function argb(color) {
  const a = ((color >>> 24) & 255) / 255, r = (color >>> 16) & 255, g = (color >>> 8) & 255, b = color & 255;
  return `rgba(${r},${g},${b},${a.toFixed(3)})`;
}
function withAlpha(color, alpha) { return ((Math.round(clamp(alpha, 0, 255)) << 24) | (color & 0xFFFFFF)) >>> 0; }
function darken(color, f) {
  const r = ((color >>> 16) & 255) * f, g = ((color >>> 8) & 255) * f, b = (color & 255) * f;
  return (0xFF000000 | (r << 16) | (g << 8) | b) >>> 0;
}
function lighten(color, a) {
  const ch = s => { const v = (color >>> s) & 255; return Math.floor(v + (255 - v) * a); };
  return (0xFF000000 | (ch(16) << 16) | (ch(8) << 8) | ch(0)) >>> 0;
}
const pad6 = n => String(Math.max(0, n)).padStart(6, '0');
class Box {
  constructor(l, t, r, b) { this.left = l; this.top = t; this.right = r; this.bottom = b; }
  get centerX() { return (this.left + this.right) / 2; }
  get centerY() { return (this.top + this.bottom) / 2; }
  get height() { return this.bottom - this.top; }
  contains(x, y) { return x >= this.left && x <= this.right && y >= this.top && y <= this.bottom; }
}

// ------------------------------------------------------------------ préférences (stockage local)

const prefs = (() => {
  let data = {};
  try { data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; } catch (e) { data = {}; }
  const save = () => { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { /* stockage plein ou interdit */ } };
  return {
    get(key, fallback) { return key in data ? data[key] : fallback; },
    set(key, value) { data[key] = value; save(); },
    remove(key) { delete data[key]; save(); },
    all() { return Object.assign({}, data); },
    replace(values) { data = Object.assign({}, values); save(); }
  };
})();

// ------------------------------------------------------------------ meilleurs scores (un top 20 par difficulté)

const DEFAULT_SCORES = [
  ['PRI', 250000], ['SMA', 225000], ['SHD', 200000], ['ACE', 180000], ['MAX', 160000], ['JAY', 140000],
  ['KIM', 120000], ['LEA', 105000], ['SAM', 90000], ['TOM', 78000], ['ZOE', 66000], ['NEO', 55000],
  ['LEX', 45000], ['BEN', 36000], ['EVE', 28000], ['FOX', 21000], ['ANN', 15000], ['DOC', 10000],
  ['CAT', 6000], ['BOB', 2500]
].map(([name, score]) => ({name, score}));
const sortScores = list => list.slice().sort((a, b) => b.score - a.score || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0));
const scoreKey = d => 'scores_' + d.id;
const HighScores = {
  entries(d) {
    const local = (prefs.get(scoreKey(d), []) || []).filter(e => e && typeof e.name === 'string' && e.score > 0);
    const seen = new Set();
    return sortScores(DEFAULT_SCORES.concat(local)).filter(e => {
      const k = e.name + '|' + e.score;
      if (seen.has(k)) return false;
      seen.add(k);
      return true;
    }).slice(0, MAX_ENTRIES);
  },
  qualifies(entries, score) { return score > 0 && (entries.length < MAX_ENTRIES || score > entries[entries.length - 1].score); },
  add(d, name, score) {
    const clean = name.trim().slice(0, MAX_NAME_LENGTH);
    const updated = sortScores(HighScores.entries(d).concat([{name: clean, score}])).slice(0, MAX_ENTRIES);
    prefs.set(scoreKey(d), updated);
    prefs.set('player_name', clean);
    return updated;
  }
};

// ------------------------------------------------------------------ collision balayée cercle / rectangle

function sweep(x, y, dx, dy, r, left, top, right, bottom) {
  const nx0 = clamp(x, left, right), ny0 = clamp(y, top, bottom);
  const ox = x - nx0, oy = y - ny0, d2 = ox * ox + oy * oy;
  if (d2 < r * r - 1e-3) {
    let nx, ny;
    if (d2 > 1e-6) { const d = Math.sqrt(d2); nx = ox / d; ny = oy / d; } else {
      const toL = x - left, toR = right - x, toT = y - top, toB = bottom - y, m = Math.min(toL, toR, toT, toB);
      if (m === toL) { nx = -1; ny = 0; } else if (m === toR) { nx = 1; ny = 0; } else if (m === toT) { nx = 0; ny = -1; } else { nx = 0; ny = 1; }
    }
    return dx * nx + dy * ny < 0 ? {time: 0, nx, ny} : null;
  }
  if (dx === 0 && dy === 0) return null;
  let enter = 0, exit = 1, nx = 0, ny = 0;
  if (dx === 0) { if (x < left - r || x > right + r) return null; } else {
    const t1 = (left - r - x) / dx, t2 = (right + r - x) / dx, near = Math.min(t1, t2);
    if (near > enter) { enter = near; nx = dx > 0 ? -1 : 1; ny = 0; }
    exit = Math.min(exit, Math.max(t1, t2));
  }
  if (dy === 0) { if (y < top - r || y > bottom + r) return null; } else {
    const t1 = (top - r - y) / dy, t2 = (bottom + r - y) / dy, near = Math.min(t1, t2);
    if (near > enter) { enter = near; nx = 0; ny = dy > 0 ? -1 : 1; }
    exit = Math.min(exit, Math.max(t1, t2));
  }
  if (enter > exit) return null;
  const hx = x + dx * enter, hy = y + dy * enter;
  if ((hx < left || hx > right) && (hy < top || hy > bottom)) {
    // Zone d'angle : contact avec le coin arrondi, s'il existe.
    const cx = hx < left ? left : right, cy = hy < top ? top : bottom;
    const fx = x - cx, fy = y - cy, a = dx * dx + dy * dy, b = 2 * (fx * dx + fy * dy), c = fx * fx + fy * fy - r * r;
    const disc = b * b - 4 * a * c;
    if (disc < 0) return null;
    const t = (-b - Math.sqrt(disc)) / (2 * a);
    if (t < 0 || t > 1) return null;
    return {time: t, nx: (fx + dx * t) / r, ny: (fy + dy * t) / r};
  }
  if (nx === 0 && ny === 0) return null;
  return {time: enter, nx, ny};
}

// ------------------------------------------------------------------ moteur de jeu

const brickLeft = i => LEFT + (i % COLS) * BRICK_WIDTH;
const brickTop = i => BRICK_TOP + Math.floor(i / COLS) * BRICK_HEIGHT;
const crystalColor = i => [0xFFE8F4FF, 0xFF55E6FF, 0xFFFF66C4, 0xFFFFD94F, 0xFFFF914D, 0xFFFF5268, 0xFF65E572][i >= 1 && i <= 6 ? i : 0];

function decodeLevel(level) {
  const offset = (level - 1) * 400, bricks = [];
  for (let i = 0; i < 400; i++) {
    const v = LEVEL_DATA[offset + i];
    if (v === 0) bricks.push({color: 0, maxHits: 0, hits: 0, solid: false});
    else if (v === 255) bricks.push({color: 0, maxHits: 1, hits: 1, solid: true});
    else bricks.push({color: v >> 4, maxHits: v & 15, hits: v & 15, solid: false});
  }
  return bricks;
}

function newStats() {
  return {bricksDestroyed: 0, powerUpsCollected: 0, levelsCompleted: 0, laserShots: 0, laserHits: 0, currentCombo: 0, bestCombo: 0};
}
const laserPrecision = s => s.laserShots === 0 ? 0 : clamp(Math.floor(s.laserHits * 100 / s.laserShots), 0, 100);

class Engine {
  constructor() {
    this.s = {
      screen: 'TITLE', score: 0, highScore: 0, lives: 3, level: 1, difficulty: Difficulty.NORMAL, stats: newStats(),
      nextExtraLife: 10000, paddleX: WIDTH / 2, paddleWidth: 66, wideTime: 0, stickyTime: 0, laserTime: 0,
      laserCooldown: 0, stateTime: 0, wormClock: 9, bricks: [], fireHeld: false, balls: [], powerUps: [],
      lasers: [], worms: [], particles: [], random: mulberry32(1987)
    };
    this.onEvent = () => {};
    this.demonstration = false;
    this.contacts = [];
  }

  startNewGame(difficulty, startLevel = 1) {
    const s = this.s;
    this.demonstration = false;
    s.difficulty = difficulty; s.score = 0; s.lives = difficulty.initialLives;
    s.level = clamp(startLevel, 1, LEVEL_COUNT); s.stats = newStats();
    s.nextExtraLife = difficulty.extraLifeThreshold; s.random = mulberry32(1987);
    this.loadLevel();
  }

  startDemo(level) {
    const s = this.s;
    this.demonstration = true;
    s.difficulty = Difficulty.NORMAL; s.score = 0; s.lives = 3; s.level = clamp(level, 1, LEVEL_COUNT);
    s.stats = newStats(); s.nextExtraLife = Infinity; s.random = mulberry32(1987 + s.level);
    this.loadLevel();
  }

  continueGame(level, score, lives, difficulty, stats) {
    const s = this.s;
    this.demonstration = false;
    s.difficulty = difficulty; s.level = clamp(level, 1, LEVEL_COUNT); s.score = Math.max(0, score);
    s.lives = clamp(lives, 1, 9); s.stats = stats; s.nextExtraLife = difficulty.extraLifeThreshold;
    while (s.nextExtraLife <= s.score) s.nextExtraLife += difficulty.extraLifeThreshold;
    s.random = mulberry32(1987 + s.level);
    this.loadLevel();
  }

  loadLevel() {
    const s = this.s;
    s.bricks = decodeLevel(s.level); s.screen = 'INTRO'; s.stateTime = 0; s.wormClock = 8; s.paddleX = WIDTH / 2;
    this.resetVolley();
  }

  resetVolley() {
    const s = this.s;
    s.balls = []; s.powerUps = []; s.lasers = []; s.worms = []; s.particles = [];
    s.wideTime = 0; s.stickyTime = 0; s.laserTime = 0; s.laserCooldown = 0; s.fireHeld = false;
    s.paddleWidth = 66; s.paddleX = WIDTH / 2;
    s.balls.push(this.ball(s.paddleX, PADDLE_Y - 5, 0, 0, true));
  }

  ball(x, y, vx, vy, stuck) { return {x, y, vx, vy, stuck, stickOffset: 0, stickyCatch: false, stallTime: 0, radius: 4.2}; }

  pause() { if (this.s.screen === 'PLAYING') this.s.screen = 'PAUSED'; }

  primaryAction() {
    const s = this.s;
    switch (s.screen) {
      case 'TITLE': case 'GAME_OVER': case 'VICTORY': this.startNewGame(s.difficulty); break;
      case 'INTRO': s.screen = 'PLAYING'; s.stateTime = 0; break;
      case 'PAUSED': s.screen = 'PLAYING'; break;
      case 'PLAYING': {
        let launched = false;
        for (const b of s.balls) if (b.stuck) { this.launch(b); launched = true; }
        if (!launched && s.laserTime > 0) this.fireLaser();
        break;
      }
    }
  }

  movePaddle(x) {
    const s = this.s;
    if (s.screen !== 'PLAYING') return;
    s.paddleX = clamp(x, LEFT + s.paddleWidth / 2, RIGHT - s.paddleWidth / 2);
  }

  launch(b) {
    // L'angle dépend de la position de la balle sur le vaisseau ; au centre, le côté est tiré au sort.
    const s = this.s, half = s.paddleWidth / 2, offset = clamp(b.stickOffset / half, -1, 1);
    const side = offset > 0.05 ? 1 : offset < -0.05 ? -1 : (s.random.nextBoolean() ? 1 : -1);
    const angle = (-90 + side * (20 + Math.abs(offset) * 40)) * Math.PI / 180;
    const speed = 210 * s.difficulty.speedScale;
    b.vx = Math.cos(angle) * speed; b.vy = Math.sin(angle) * speed;
    b.stuck = false; b.stickyCatch = false; b.stallTime = 0;
  }

  update(dt) {
    const s = this.s;
    if (s.screen === 'INTRO') {
      s.stateTime += dt;
      if (s.stateTime >= 1.8) { s.screen = 'PLAYING'; s.stateTime = 0; }
      return;
    }
    if (s.screen === 'LEVEL_CLEAR') {
      s.stateTime += dt;
      this.updateParticles(dt);
      if (s.stateTime >= 1.8) {
        if (s.level >= LEVEL_COUNT) s.screen = 'VICTORY'; else { s.level++; this.loadLevel(); }
      }
      return;
    }
    if (s.screen !== 'PLAYING') return;
    s.stateTime += dt;
    s.wideTime = Math.max(0, s.wideTime - dt);
    const stickyWasActive = s.stickyTime > 0;
    s.stickyTime = Math.max(0, s.stickyTime - dt);
    if (stickyWasActive && s.stickyTime === 0) s.balls.filter(b => b.stuck && b.stickyCatch).forEach(b => this.launch(b));
    s.laserTime = Math.max(0, s.laserTime - dt);
    s.laserCooldown = Math.max(0, s.laserCooldown - dt);
    if (s.fireHeld && s.laserTime > 0 && !s.balls.some(b => b.stuck)) this.fireLaser();
    s.paddleWidth = s.wideTime > 0 ? 98 : 66;
    this.movePaddle(s.paddleX);
    this.updateBalls(dt);
    if (s.screen !== 'PLAYING') return;
    this.updatePowerUps(dt);
    if (s.screen !== 'PLAYING') return;
    this.updateLasers(dt);
    this.updateWorms(dt);
    if (s.screen !== 'PLAYING') return;
    this.updateParticles(dt);
    s.wormClock -= dt;
    if (s.wormClock <= 0) {
      const remaining = this.remainingBricks();
      if (s.worms.length < 2 && remaining >= 1 && remaining <= 260) this.spawnWorm();
      s.wormClock = 10 + s.random.nextFloat() * 8;
    }
    if (this.remainingBricks() === 0) this.completeLevel();
  }

  updateBalls(dt) {
    const s = this.s;
    for (let i = s.balls.length - 1; i >= 0; i--) {
      const b = s.balls[i];
      if (b.stuck) { b.x = s.paddleX + b.stickOffset; b.y = PADDLE_Y - b.radius - 0.5; continue; }
      const oldX = b.x, oldY = b.y;
      this.moveThroughBricks(b, dt);
      if (b.x - b.radius < LEFT) { b.x = LEFT + b.radius; b.vx = Math.abs(b.vx); }
      else if (b.x + b.radius > RIGHT) { b.x = RIGHT - b.radius; b.vx = -Math.abs(b.vx); }
      if (b.y - b.radius < TOP) { b.y = TOP + b.radius; b.vy = Math.abs(b.vy); }
      this.collidePaddle(b, oldY);
      this.collideWorms(b);
      if (!b.stuck) {
        ballEnsure(b, 340 * s.difficulty.speedScale);
        const moved = hypot(b.x - oldX, b.y - oldY);
        b.stallTime = moved < 0.01 ? b.stallTime + dt : 0;
        if (b.stallTime >= 1.25) ballRelease(b);
      }
      if (b.y - b.radius > BOTTOM) s.balls.splice(i, 1);
    }
    if (s.balls.length === 0) this.loseLife();

  collidePaddle(b, oldY) {

    if (b.vy <= 0) return;

    if (oldY + b.radius > PADDLE_Y || b.y + b.radius < PADDLE_Y) return;
    if (b.y - b.radius > PADDLE_Y + PADDLE_HEIGHT) return;
    if (b.x + b.radius < s.paddleX - half || b.x - b.radius > s.paddleX + half) return;

  moveThroughBricks(b, dt) {

    for (let n = 0; n < MAX_BOUNCES_PER_STEP; n++) {
      if (remaining <= 0) return;
      const dx = b.vx * remaining, dy = b.vy * remaining;
      this.findFirstContacts(b, dx, dy);
      const contacts = this.contacts;
      if (contacts.length === 0) { b.x += dx; b.y += dy; return; }

      b.x += dx * time; b.y += dy * time;

  accelerateBalls() {

    }
  }

  spawnPowerUp(x, y) {

      if (withinX && withinY) { s.powerUps.splice(i, 1); this.applyPower(p.type.id); return; }
      if (p.y > HEIGHT + 10) s.powerUps.splice(i, 1);

  }

  applyPower(type) {

      case 'WIDE': s.wideTime = 18; break;
      case 'SLOW': for (const b of s.balls) if (!b.stuck) {

      case 'MULTI': this.splitBalls(); break;

  splitBalls() {

  spawnWorm() {

  }

  updateParticles(dt) {

}

}

    for (let i = 3; i >= 1; i--) circle(b.x - b.vx / speed * i * 4.2, b.y - b.vy / speed * i * 4.2, b.radius * (1 - i * 0.16), withAlpha(0xFF55E6FF, 24 + (4 - i) * 18));
  }
  const glow = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.radius * 2.6);
  glow.addColorStop(0, argb(0x8855E6FF)); glow.addColorStop(1, argb(0x0055E6FF));
  circle(b.x, b.y, b.radius * 2.6, glow);
  const body = ctx.createRadialGradient(b.x - b.radius * 0.35, b.y - b.radius * 0.4, 0, b.x - b.radius * 0.35, b.y - b.radius * 0.4, b.radius * 1.25);
  body.addColorStop(0, '#ffffff'); body.addColorStop(1, argb(0xFF28A8E8));
  circle(b.x, b.y, b.radius, body);
  ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, 7); ctx.lineWidth = 0.65; ctx.strokeStyle = argb(0xFF073B66); ctx.stroke();
  circle(b.x - 1.35, b.y - 1.45, b.radius * 0.28, 0xFFFFFFFF);
}

function drawPowerUp(p) {
  const pulse = 11 + Math.sin(motionClock() * 7 + p.x) * 1.5;
  const glow = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, pulse);
  glow.addColorStop(0, 'rgba(255,255,255,0.4)'); glow.addColorStop(1, 'rgba(255,255,255,0)');
  circle(p.x, p.y, pulse, glow);
  drawCrystal(p.x, p.y, 8, p.type.color, p.rotation);
  text(p.type.symbol, p.x, p.y + 3.2, 9, 0xFFFFFFFF, true);
}

function drawWorm(w) {
  for (let i = 4; i >= 0; i--) {
    const x = w.x + Math.sin(w.age * 5 - i * 0.65 + w.phase) * 4, y = w.y - i * 5, r = 5.2 - i * 0.35;
    circle(x, y, r + 0.8, 0xFF101A20);
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, 0, x - r * 0.35, y - r * 0.4, r * 1.3);
    g.addColorStop(0, argb(i === 0 ? 0xFFE5FF8B : 0xFF9BE8D4)); g.addColorStop(1, argb(i === 0 ? 0xFF5C8E2B : 0xFF287C78));
    circle(x, y, r, g);
    circle(x - r * 0.32, y - r * 0.35, Math.max(0.55, r * 0.16), 0xAAFFFFFF);
    ctx.beginPath(); ctx.arc(x, y, r * 0.72, 0, 7); ctx.lineWidth = 0.55; ctx.strokeStyle = argb(0xFF193A3D); ctx.stroke();
  }
  circle(w.x - 1.8, w.y - 1, 1.15, 0xFF071317); circle(w.x + 1.8, w.y - 1, 1.15, 0xFF071317);
  circle(w.x - 1.8, w.y - 1.1, 0.55, 0xFFFF566C); circle(w.x + 1.8, w.y - 1.1, 0.55, 0xFFFF566C);
  ctx.beginPath(); ctx.moveTo(w.x - 3, w.y + 2); ctx.lineTo(w.x - 1, w.y + 3.5); ctx.moveTo(w.x + 3, w.y + 2); ctx.lineTo(w.x + 1, w.y + 3.5);
  ctx.lineWidth = 0.8; ctx.strokeStyle = argb(0xFFD3E4DF); ctx.stroke();
}

  drawPaddle();
  st.balls.forEach(drawBall);
  if (st.screen === 'PLAYING' && app.controlMode === 'ZONES' && app.deckHeight <= 0) {
    for (const left of [true, false]) {
      const [l, r] = left ? [13, 103] : [257, 347];

function drawScrollHints(contentHeight, scroll, viewport, hint) {

// ---------------------------------------------------------------- logique d'écrans

function activePage() {
  if (st.screen === 'TITLE') return app.titlePage;
  if (st.screen === 'PAUSED' && app.settingsOpen) return app.settingsPage;
  return null;
}
function pageMax(page) { return page === app.titlePage ? titleLayout().maxScroll(app.viewport) : app.settingsLayout.maxScroll(app.viewport); }

function recordFor(d) { const e = HighScores.entries(d); return e.length ? e[0].score : 0; }

function saveCheckpoint() {
  if (app.demoMode) return;
  const s = st.stats;
  prefs.set('has_progress', true); prefs.set('saved_level', st.level); prefs.set('saved_score', st.score);
  prefs.set('saved_lives', st.lives); prefs.set('saved_difficulty', st.difficulty.id); prefs.set('saved_stats', s);
}

function beginNewGame() {
  app.settingsOpen = false;
  engine.startNewGame(app.selectedDifficulty, app.startLevel);
  st.highScore = recordFor(app.selectedDifficulty);
  Music.start(app.musicVolume);
  app.tutorialStep = prefs.get('tutorial_done', false) ? 0 : 1; app.tutorialTimer = 0;
}

function continueSavedGame() {
  if (!hasProgress()) { beginNewGame(); return; }
  app.tutorialStep = 0; app.settingsOpen = false;
  const d = Difficulty[prefs.get('saved_difficulty', 'NORMAL')] || Difficulty.NORMAL;
  const stats = Object.assign(newStats(), prefs.get('saved_stats', {}));
  engine.continueGame(prefs.get('saved_level', 1), prefs.get('saved_score', 0), prefs.get('saved_lives', d.initialLives), d, stats);
  st.highScore = recordFor(d);
  Music.start(app.musicVolume);
}

function finishTutorial() { app.tutorialStep = 0; app.tutorialTimer = 0; prefs.set('tutorial_done', true); }
function updateTutorial(dt) {
  if (app.tutorialStep === 0 || st.screen !== 'PLAYING') return;
  if (app.tutorialStep === 1 && Math.abs(st.paddleX - WIDTH / 2) > 18) app.tutorialStep = 2;
  else if (app.tutorialStep === 2 && st.balls.length && !st.balls.some(b => b.stuck)) { app.tutorialStep = 3; app.tutorialTimer = 0; }
  else if (app.tutorialStep === 3) { app.tutorialTimer += dt; if (app.tutorialTimer >= 5) finishTutorial(); }
}

function startDemo() { app.demoMode = true; app.tutorialStep = 0; app.demoIndex = 0; app.pendingEntry = null; app.recentEntry = null; startDemoLevel(); }
function startDemoLevel() {
  app.demoTime = 0; app.demoActionTime = 0;
  engine.startDemo(DEMO_LEVELS[app.demoIndex]);
  st.screen = 'PLAYING'; st.stateTime = 0; engine.primaryAction(); app.lastScreen = 'PLAYING';
}
function stopDemo() {
  app.demoMode = false; engine.demonstration = false;
  st.screen = 'TITLE'; st.score = 0; st.level = 1;
  showLeaderboard(app.selectedDifficulty);
  app.lastScreen = 'TITLE'; app.lastInteraction = performance.now(); app.accumulator = 0;
}
function updateDemo(dt) {
  app.demoTime += dt; app.demoActionTime += dt;
  if (app.demoTime >= 12 || ['LEVEL_CLEAR', 'GAME_OVER', 'VICTORY'].includes(st.screen)) {
    app.demoIndex = (app.demoIndex + 1) % DEMO_LEVELS.length; startDemoLevel(); return;
  }
  if (st.screen === 'INTRO') { st.screen = 'PLAYING'; st.stateTime = 0; }
  if (st.screen !== 'PLAYING') return;
  const moving = st.balls.filter(b => !b.stuck);
  const falling = moving.filter(b => b.vy > 0).sort((a, b) => (PADDLE_Y - a.y) / a.vy - (PADDLE_Y - b.y) / b.vy);
  const target = falling[0] || moving[0] || st.balls[0];
  const tx = target ? predictBallX(target) : WIDTH / 2, max = 430 * dt;
  engine.movePaddle(st.paddleX + clamp(tx - st.paddleX, -max, max));
  if (st.balls.some(b => b.stuck) || app.demoActionTime >= 0.55) { engine.primaryAction(); app.demoActionTime = 0; }
}
function predictBallX(b) {
  if (b.stuck || b.vy <= 0) return b.x;
  const min = LEFT + b.radius, w = RIGHT - b.radius - min, time = clamp((PADDLE_Y - b.y) / b.vy, 0, 4);
  const period = w * 2, travel = b.x + b.vx * time - min, wrapped = ((travel % period) + period) % period;
  return min + (wrapped <= w ? wrapped : period - wrapped);
}

function rememberLevelReached(level) {
  if (app.demoMode || level <= app.maxLevelReached) return;
  app.maxLevelReached = Math.min(LEVEL_COUNT, level);
  prefs.set('max_level_reached', app.maxLevelReached);
}

function checkScreenChange() {
  if (app.demoMode) { app.lastScreen = st.screen; return; }
  const changed = st.screen !== app.lastScreen;
  app.lastScreen = st.screen;
  if (!changed) return;
  if (st.screen === 'INTRO') { saveCheckpoint(); rememberLevelReached(st.level); }
  if (st.screen === 'GAME_OVER' || st.screen === 'VICTORY') prefs.set('has_progress', false);
}

function openHighScores() {
  if (st.screen !== 'GAME_OVER' && st.screen !== 'VICTORY') return;
  const finalScore = st.score, best = st.highScore;
  showLeaderboard(st.difficulty);
  st.highScore = Math.max(st.highScore, best);
  const candidate = HighScores.qualifies(app.leaderboard, finalScore) ? {name: '...', score: finalScore} : null;
  app.pendingEntry = candidate; app.recentEntry = candidate;
  app.initials = candidate ? new InitialsEntry(prefs.get('player_name', '')) : null;
  app.initialsRoll = 0;
  st.screen = 'HIGH_SCORES'; app.lastScreen = 'HIGH_SCORES';
}
function leaveHighScores() { app.recentEntry = null; showLeaderboard(app.selectedDifficulty); st.screen = 'TITLE'; }
function stepInitials(d) {
  if (!app.initials) return;
  app.initials.step(d);
  app.initialsRoll = app.reducedMotion ? 0 : Math.sign(d);
  if (app.soundEnabled) Sound.play('PADDLE');
  vibrate(5);
}
function saveInitials() {
  const e = app.initials;
  if (!e || !app.pendingEntry || !e.isValid) return;
  const score = app.pendingEntry.score;
  app.leaderboard = HighScores.add(app.leaderboardDifficulty, e.name, score);
  app.recentEntry = {name: e.name, score}; app.pendingEntry = null; app.initials = null;
  if (app.soundEnabled) Sound.play('POWER');
}
function skipInitials() { app.pendingEntry = null; app.recentEntry = null; app.initials = null; }

function tapInitials(x, y) {
  const e = app.initials;
  for (let p = 0; p < 3; p++) {
    if (Initials.up(p).contains(x, y)) { e.select(p); stepInitials(1); return; }
    if (Initials.down(p).contains(x, y)) { e.select(p); stepInitials(-1); return; }
    if (Initials.wheel(p).contains(x, y)) { e.select(p); return; }
  }
  if (Initials.validate.contains(x, y)) saveInitials();
  else if (Initials.skip.contains(x, y)) skipInitials();
}

function handleTitleTouch(x, y) {
  const l = titleLayout();
  if (l.primary.contains(x, y)) { if (hasProgress()) continueSavedGame(); else beginNewGame(); }
  else if (l.secondary && l.secondary.contains(x, y)) beginNewGame();
  else if (l.difficulty.contains(x, y)) {
    app.selectedDifficulty = DIFFICULTIES[(DIFFICULTIES.indexOf(app.selectedDifficulty) + 1) % 3];
    prefs.set('difficulty', app.selectedDifficulty.id);
    showLeaderboard(app.selectedDifficulty);
  } else if (l.startLevel && l.startLevel.contains(x, y)) {
    app.startLevel = app.startLevel % app.maxLevelReached + 1; prefs.set('start_level', app.startLevel);
  } else if (l.audio.contains(x, y)) { app.audioSetupVisible = true; app.audioSetupFirstRun = false; }
  else if (l.bonusCard.contains(x, y)) advanceBonusGuide();
}
function advanceBonusGuide() { app.bonusIndex = (app.bonusIndex + 1) % 8; app.bonusTimer = 0; app.bonusAnimation = app.reducedMotion ? 0 : 1; }

function handleAudioSetupTouch(x, y) {
  if (x < 50 || x > 310) return;
  if (y >= 220 && y <= 265) toggleMusic();
  else if (y >= 280 && y <= 325) { app.soundEnabled = !app.soundEnabled; prefs.set('sound_enabled', app.soundEnabled); }
  else if (y >= 340 && y <= 385) chooseMusic();
  else if (y >= 449 && y <= 501) {
    const start = app.audioSetupFirstRun;
    app.audioSetupVisible = false; app.audioSetupFirstRun = false; prefs.set('audio_setup_done', true);
    app.lastInteraction = performance.now();
    if (start) { if (hasProgress()) continueSavedGame(); else beginNewGame(); }
  }
}

function handlePauseTouch(x, y) {
  if (x < 50 || x > 310 || app.settingsOpen) return;
  y -= overlayShift();
  if (y >= 215 && y <= 260) st.screen = 'PLAYING';
  else if (y >= 280 && y <= 325) beginNewGame();
  else if (y >= 345 && y <= 390) { app.settingsOpen = true; app.settingsPage.scroll = 0; }
  else if (y >= 410 && y <= 455) { app.tutorialStep = 0; app.zoneDirection = 0; st.screen = 'TITLE'; }
}

const nextFineVolume = v => v >= 100 ? 0 : (Math.floor(v / 10) + 1) * 10;
const nextSensitivity = v => v < 0.9 ? 1 : v > 1.1 ? 0.75 : 1.35;

function handleSettingsTouch(x, y) {
  switch (app.settingsLayout.hit(x, y)) {
    case 'SOUND': app.soundEnabled = !app.soundEnabled; prefs.set('sound_enabled', app.soundEnabled); break;
    case 'EFFECTS_VOLUME': app.effectsVolume = nextFineVolume(app.effectsVolume); Sound.setVolume(app.effectsVolume); prefs.set('effects_volume', app.effectsVolume); Sound.play('PADDLE'); break;
    case 'MUSIC': toggleMusic(); break;
    case 'MUSIC_VOLUME': if (!Music.loaded) chooseMusic(); else updateMusicVolume(nextFineVolume(app.musicVolume)); break;
    case 'MUSIC_CHOOSE': chooseMusic(); break;
    case 'MUSIC_REMOVE': if (Music.loaded) { Music.clear(); app.musicVolume = 0; } break;
    case 'CONTROLS': app.controlMode = CONTROL_MODES[(CONTROL_MODES.indexOf(app.controlMode) + 1) % 3]; app.zoneDirection = 0; prefs.set('control_mode', app.controlMode); break;
    case 'TOUCH_SENSITIVITY': app.touchSensitivity = nextSensitivity(app.touchSensitivity); prefs.set('touch_sensitivity', app.touchSensitivity); break;
    case 'GAMEPAD_SENSITIVITY': app.gamepadSensitivity = nextSensitivity(app.gamepadSensitivity); prefs.set('gamepad_sensitivity', app.gamepadSensitivity); break;
    case 'HAPTICS': app.hapticsEnabled = !app.hapticsEnabled; prefs.set('haptics_enabled', app.hapticsEnabled); vibrate(10); break;
    case 'LANGUAGE': app.language = app.language === 'fr' ? 'en' : 'fr'; prefs.set('language', app.language); document.documentElement.lang = app.language; break;
    case 'VISUAL_EFFECTS': app.visualEffects = !app.visualEffects; app.shake = 0; app.flash = 0; prefs.set('visual_effects', app.visualEffects); break;
    case 'HIGH_CONTRAST': app.highContrast = !app.highContrast; prefs.set('high_contrast', app.highContrast); break;
    case 'REDUCED_MOTION': app.reducedMotion = !app.reducedMotion; app.shake = 0; app.flash = 0; app.bonusAnimation = 0; prefs.set('reduced_motion', app.reducedMotion); break;
    case 'EXPORT': exportBackup(); break;
    case 'IMPORT': if (confirm(app.t.restoreMessage)) document.getElementById('fichier-sauvegarde').click(); break;
    case 'BACK': app.settingsOpen = false; break;
  }
}

function toggleMusic() { if (!Music.loaded) chooseMusic(); else updateMusicVolume(app.musicVolume === 0 ? app.lastMusicVolume : 0); }
function updateMusicVolume(v) {
  app.musicVolume = clamp(v, 0, 100);
  if (app.musicVolume > 0) { app.lastMusicVolume = app.musicVolume; prefs.set('last_music_volume', app.lastMusicVolume); }
  Music.setVolume(app.musicVolume);
  Music.start(app.musicVolume);
}
function chooseMusic() { document.getElementById('fichier-musique').click(); }
document.getElementById('fichier-musique').addEventListener('change', e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  Music.load(file, () => { app.musicVolume = 0; toast(app.t.unreadableAudio); });
  updateMusicVolume(app.musicVolume === 0 ? app.lastMusicVolume : app.musicVolume);
});

// Sauvegarde : un fichier JSON avec les réglages, les scores et la progression.
function exportBackup() {
  saveCheckpoint();
  const values = prefs.all();
  const blob = new Blob([JSON.stringify({format: 'PRISM_SMASH_BACKUP_V1', values}, null, 1)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = app.t.backupFileName;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast(app.t.backupExported(Object.keys(values).length));
}
document.getElementById('fichier-sauvegarde').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    if (file.size > 65536) throw new Error('trop volumineux');
    const parsed = JSON.parse(await file.text());
    if (!parsed || parsed.format !== 'PRISM_SMASH_BACKUP_V1' || typeof parsed.values !== 'object') throw new Error('format');
    const v = parsed.values;
    for (const d of DIFFICULTIES) if (v[scoreKey(d)] !== undefined && !Array.isArray(v[scoreKey(d)])) throw new Error('scores');
    prefs.replace(v);
    toast(TEXTS[v.language === 'en' ? 'en' : 'fr'].backupRestored(Object.keys(v).length));
    setTimeout(() => location.reload(), 900);
  } catch (err) { toast(app.t.backupInvalid); }
});

// ---------------------------------------------------------------- commandes : toucher et souris

const toGameX = x => (x - app.offsetX) / app.viewScale;
const toGameY = y => (y - app.offsetY) / app.viewScale;
const zoneFor = x => x < 120 ? -1 : x > 240 ? 1 : 0;
function zoneFromPointers() {
  let d = 0;
  for (const p of app.pointers.values()) d += zoneFor(toGameX(p.x));
  return clamp(d, -1, 1);
}
const touchSlop = 8;

canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  app.lastInteraction = performance.now();
  Sound.unlock();
  const first = app.pointers.size === 0;
  app.pointers.set(e.pointerId, {x: e.clientX, y: e.clientY, startY: e.clientY, lastY: e.clientY, lastT: e.timeStamp, dragging: false, pressScroll: 0});
  if (app.demoMode) { if (first) stopDemo(); return; }
  const x = toGameX(e.clientX), y = toGameY(e.clientY);
  if (!first) {
    // Un second doigt lance ou tire sans interrompre le pilotage du premier.
    if (st.screen === 'PLAYING') {
      if (app.controlMode === 'ZONES') { app.zoneDirection = zoneFromPointers(); if (zoneFor(x) === 0) engine.primaryAction(); }
      else engine.primaryAction();
      st.fireHeld = true;
    }
    return;
  }
  const page = activePage();
  if (page) { const p = app.pointers.get(e.pointerId); p.pressScroll = page.scroll; page.fling = 0; return; }
  switch (st.screen) {
    case 'HIGH_SCORES':
      if (app.initials) { app.initialsDrag = 0; }
      else if (!app.pendingEntry) leaveHighScores();
      break;
    case 'GAME_OVER': case 'VICTORY': openHighScores(); break;
    case 'PAUSED': handlePauseTouch(x, y); break;
    case 'PLAYING':
      if (x > 305 && y < 52) { engine.pause(); releaseControls(); }
      else if (app.tutorialStep > 0 && x > 265 && y >= 505 && y <= 535) finishTutorial();
      else {
        app.steeringId = e.pointerId; app.lastTouchX = x;
        if (app.controlMode === 'RELATIVE') engine.primaryAction();
        else if (app.controlMode === 'DIRECT') { engine.movePaddle(x); engine.primaryAction(); }
        else { app.zoneDirection = zoneFor(x); if (app.zoneDirection === 0) engine.primaryAction(); }
        st.fireHeld = true;
      }
      break;
    default: engine.primaryAction();
  }
});

canvas.addEventListener('pointermove', e => {
  const p = app.pointers.get(e.pointerId);
  if (!p) {
    // Souris sans bouton enfoncé : en mode direct, le vaisseau suit le curseur.
    if (e.pointerType === 'mouse' && st.screen === 'PLAYING' && app.controlMode === 'DIRECT' && !app.demoMode) engine.movePaddle(toGameX(e.clientX));
    return;
  }
  const page = activePage();
  if (!p.dragging && Math.abs(e.clientY - p.startY) > touchSlop) p.dragging = true;
  if (st.screen === 'HIGH_SCORES' && app.initials) {
    if (!p.dragging) { p.lastY = e.clientY; return; }
    app.initialsDrag += (e.clientY - p.lastY) / app.viewScale;
    const pitch = Initials.PITCH * 0.75;
    while (app.initialsDrag <= -pitch) { stepInitials(1); app.initialsDrag += pitch; }
    while (app.initialsDrag >= pitch) { stepInitials(-1); app.initialsDrag -= pitch; }
  } else if (page && !(page === app.titlePage && app.audioSetupVisible)) {
    if (p.dragging) {
      const dt = Math.max(1, e.timeStamp - p.lastT) / 1000;
      page.fling = page.fling * 0.6 + (-(e.clientY - p.lastY) / app.viewScale / dt) * 0.4;
      page.scroll = clamp(p.pressScroll - (e.clientY - p.startY) / app.viewScale, 0, pageMax(page));
    }
  } else if (st.screen === 'PLAYING') {
    if (app.controlMode === 'ZONES') { p.x = e.clientX; app.zoneDirection = zoneFromPointers(); }
    else if (e.pointerId === app.steeringId) {
      const x = toGameX(e.clientX);
      if (app.controlMode === 'RELATIVE') engine.movePaddle(st.paddleX + (x - app.lastTouchX) * app.touchSensitivity);
      else engine.movePaddle(x);
      app.lastTouchX = x;
    }
  }
  p.x = e.clientX; p.lastY = e.clientY; p.lastT = e.timeStamp;
});

function pointerEnd(e, cancelled) {
  const p = app.pointers.get(e.pointerId);
  if (!p) return;
  app.pointers.delete(e.pointerId);
  if (app.demoMode) return;
  if (e.pointerId === app.steeringId) {
    const next = app.pointers.entries().next().value;
    app.steeringId = next ? next[0] : null;
    if (next) app.lastTouchX = toGameX(next[1].x);
  }
  if (app.controlMode === 'ZONES') app.zoneDirection = zoneFromPointers();
  if (app.pointers.size === 0) { st.fireHeld = false; app.zoneDirection = 0; }
  if (cancelled) return;
  const x = toGameX(e.clientX);
  if (st.screen === 'HIGH_SCORES' && app.initials && !p.dragging) { tapInitials(x, toGameY(e.clientY) - overlayShift()); return; }
  const page = activePage();
  if (page && app.pointers.size === 0) {
    if (p.dragging) { if (app.reducedMotion || e.timeStamp - p.lastT > 80) page.fling = 0; return; }
    page.fling = 0;
    const vy = e.clientY / app.viewScale;
    if (page === app.settingsPage) handleSettingsTouch(x, vy + page.scroll);
    else if (app.audioSetupVisible) handleAudioSetupTouch(x, vy - audioOverlayOffset());
    else handleTitleTouch(x, vy + page.scroll);
  }
}
canvas.addEventListener('pointerup', e => pointerEnd(e, false));
canvas.addEventListener('pointercancel', e => pointerEnd(e, true));
canvas.addEventListener('wheel', e => {
  const page = activePage();
  if (!page || app.audioSetupVisible) return;
  page.fling = 0;
  page.scroll = clamp(page.scroll + e.deltaY / app.viewScale, 0, pageMax(page));
  e.preventDefault();
}, {passive: false});
canvas.addEventListener('contextmenu', e => e.preventDefault());

function releaseControls() {
  app.zoneDirection = 0; app.leftPressed = false; app.rightPressed = false; app.gamepadAxis = 0;
  app.steeringId = null; st.fireHeld = false;
}

// ---------------------------------------------------------------- commandes : clavier et manette

const FIRE_KEYS = new Set([' ', 'Enter']);
window.addEventListener('keydown', e => {
  app.lastInteraction = performance.now();
  Sound.unlock();
  if (st.screen === 'HIGH_SCORES' && app.initials && handleInitialsKey(e)) { e.preventDefault(); return; }
  const page = activePage();
  if ((e.key === 'ArrowUp' || e.key === 'ArrowDown') && page && !app.demoMode && !(page === app.titlePage && app.audioSetupVisible)) {
    page.fling = 0; page.scroll = clamp(page.scroll + (e.key === 'ArrowDown' ? 120 : -120), 0, pageMax(page));
    e.preventDefault(); return;
  }
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'q') { app.leftPressed = true; e.preventDefault(); return; }
  if (e.key === 'ArrowRight' || e.key === 'd') { app.rightPressed = true; e.preventDefault(); return; }
  if (e.key === 'p' || e.key === 'P') { if (!e.repeat) togglePause(); return; }
  if (e.key === 'Escape' || e.key === 'Backspace') { if (!e.repeat) handleBack(); e.preventDefault(); return; }
  if (FIRE_KEYS.has(e.key)) {
    if (!e.repeat) externalAction();
    if (st.screen === 'PLAYING') st.fireHeld = true;
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'q') app.leftPressed = false;
  else if (e.key === 'ArrowRight' || e.key === 'd') app.rightPressed = false;
  else if (FIRE_KEYS.has(e.key)) st.fireHeld = false;
});

function handleInitialsKey(e) {
  const entry = app.initials;
  if (e.key === 'ArrowUp') stepInitials(1);
  else if (e.key === 'ArrowDown') stepInitials(-1);
  else if (e.key === 'ArrowLeft' || e.key === 'Backspace') entry.move(-1);
  else if (e.key === 'ArrowRight') entry.move(1);
  else if (e.key === 'Enter') { if (!e.repeat) { if (entry.isLast) saveInitials(); else entry.move(1); } }
  else if (e.key === 'Escape') skipInitials();
  else if (e.key.length === 1 && e.key !== ' ') return entry.type(e.key);
  else return false;
  return true;
}

function togglePause() {
  if (app.demoMode) stopDemo();
  else if (st.screen === 'PLAYING') { engine.pause(); releaseControls(); }
  else if (st.screen === 'PAUSED') { app.settingsOpen = false; st.screen = 'PLAYING'; }
  else externalAction();
}
function externalAction() {
  app.lastInteraction = performance.now();
  if (app.demoMode) { stopDemo(); return; }
  if (app.audioSetupVisible && st.screen === 'TITLE') { handleAudioSetupTouch(180, 475); return; }
  switch (st.screen) {
    case 'TITLE': if (hasProgress()) continueSavedGame(); else beginNewGame(); break;
    case 'GAME_OVER': case 'VICTORY': openHighScores(); break;
    case 'HIGH_SCORES': if (!app.pendingEntry) leaveHighScores(); break;
    case 'PAUSED': if (app.settingsOpen) app.settingsOpen = false; else st.screen = 'PLAYING'; break;
    default: engine.primaryAction();
  }
}
function handleBack() {
  if (app.demoMode) { stopDemo(); return; }
  if (st.screen === 'TITLE' && app.audioSetupVisible) { app.audioSetupVisible = false; app.audioSetupFirstRun = false; prefs.set('audio_setup_done', true); return; }
  if (st.screen === 'TITLE') return;
  if (st.screen === 'HIGH_SCORES' && app.initials) { skipInitials(); return; }
  switch (st.screen) {
    case 'PLAYING': engine.pause(); releaseControls(); break;
    case 'PAUSED': if (app.settingsOpen) app.settingsOpen = false; else st.screen = 'PLAYING'; break;
    case 'GAME_OVER': case 'VICTORY': openHighScores(); break;
    case 'HIGH_SCORES': leaveHighScores(); break;
    default: st.screen = 'TITLE';
  }
}

// Manettes : croix ou stick gauche pour piloter, A/X pour lancer et tirer, START pour la pause.
function pollGamepads() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let axis = 0;
  for (const pad of pads) {
    if (!pad) continue;
    const stick = pad.axes[0] || 0;
    const dpad = (pad.buttons[15] && pad.buttons[15].pressed ? 1 : 0) - (pad.buttons[14] && pad.buttons[14].pressed ? 1 : 0);
    axis = dpad !== 0 ? dpad : stick;
    const pressed = i => !!(pad.buttons[i] && pad.buttons[i].pressed);
    const edge = i => { const was = app.gamepadButtons[pad.index + ':' + i]; const now = pressed(i); app.gamepadButtons[pad.index + ':' + i] = now; return now && !was; };
    if (st.screen === 'HIGH_SCORES' && app.initials) {
      if (edge(12)) stepInitials(1);
      if (edge(13)) stepInitials(-1);
      if (edge(14)) app.initials.move(-1);
      if (edge(15)) app.initials.move(1);
      if (edge(0) || edge(2) || edge(9)) { if (app.initials.isLast) saveInitials(); else app.initials.move(1); }
      continue;
    }
    if (edge(9)) togglePause();
    if (edge(1)) handleBack();
    const fire = pressed(0) || pressed(2);
    if (edge(0) || edge(2)) externalAction();
    if (st.screen === 'PLAYING' && app.pointers.size === 0) st.fireHeld = fire;
    if (Math.abs(axis) >= 0.18) app.lastInteraction = performance.now();
  }
  app.gamepadAxis = clamp(axis, -1, 1);
}

function updateDirectionalControls(dt) {
  if (st.screen !== 'PLAYING') return;
  const keyboard = (app.rightPressed ? 1 : 0) - (app.leftPressed ? 1 : 0);
  const analog = Math.abs(app.gamepadAxis) >= 0.18 ? app.gamepadAxis : 0;
  const v = clamp(keyboard + app.zoneDirection, -1, 1) * app.touchSensitivity + analog * app.gamepadSensitivity;
  if (v !== 0) engine.movePaddle(st.paddleX + v * 340 * dt);
}

// La partie se met en pause quand la page passe en arrière-plan.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (!app.demoMode) engine.pause(); releaseControls(); Music.pause(); app.running = false; }
  else { app.running = true; app.lastFrame = 0; app.accumulator = 0; app.lastInteraction = performance.now(); Music.start(app.musicVolume); }
});
window.addEventListener('blur', () => { if (!app.demoMode) engine.pause(); releaseControls(); });

// ---------------------------------------------------------------- boucle principale

function frame(now) {
  requestAnimationFrame(frame);
  if (!app.running) return;
  const elapsed = app.lastFrame === 0 ? 0 : Math.min(MAX_FRAME_TIME, (now - app.lastFrame) / 1000);
  app.lastFrame = now;
  pollGamepads();
  if (!app.demoMode && !app.audioSetupVisible && st.screen === 'TITLE' && now - app.lastInteraction >= 60000) startDemo();
  app.clock += elapsed;
  app.shake = Math.max(0, app.shake - elapsed * 15);
  app.flash = Math.max(0, app.flash - elapsed * 1.8);
  app.extraLifeBanner = Math.max(0, app.extraLifeBanner - elapsed);
  app.initialsRoll = Math.abs(app.initialsRoll) < 0.02 ? 0 : app.initialsRoll * Math.exp(-14 * elapsed);
  if (!app.demoMode && st.screen === 'TITLE') {
    app.bonusTimer += elapsed;
    app.bonusAnimation = Math.max(0, app.bonusAnimation - elapsed * 3.5);
    if (app.bonusTimer >= 4.5) advanceBonusGuide();
  }
  const page = activePage();
  if (page && page.fling && app.pointers.size === 0) {
    const target = page.scroll + page.fling * elapsed;
    page.fling *= Math.exp(-3.5 * elapsed);
    const clamped = clamp(target, 0, pageMax(page));
    if (clamped !== target || Math.abs(page.fling) < 15) page.fling = 0;
    page.scroll = clamped;
  }
  app.accumulator += elapsed;
  while (app.accumulator >= STEP) {
    if (app.demoMode) updateDemo(STEP); else { updateTutorial(STEP); updateDirectionalControls(STEP); }
    engine.update(STEP);
    app.accumulator -= STEP;
  }
  checkScreenChange();
  render();
}

function render() {
  ctx = screenCtx;
  ctx.setTransform(app.dpr, 0, 0, app.dpr, 0, 0);
  const bg = ctx.createLinearGradient(0, 0, 0, app.ch);
  bg.addColorStop(0, argb(0xFF030611)); bg.addColorStop(1, argb(0xFF101638));
  ctx.fillStyle = bg; ctx.fillRect(0, 0, app.cw, app.ch);
  const page = activePage();
  if (page) {
    ctx.translate(app.offsetX, app.titleTop); ctx.scale(app.viewScale, app.viewScale);
    if (page === app.titlePage) drawTitleScreen(); else drawSettingsScreen();
    return;
  }
  ctx.translate(app.offsetX, app.offsetY); ctx.scale(app.viewScale, app.viewScale);
  drawBackdrop(app.offsetY);
  drawBackground();
  drawDeck();
  if (st.screen === 'HIGH_SCORES') {
    ctx.save(); ctx.translate(0, overlayShift()); drawHighScoreTable(); ctx.restore();
  } else {
    ctx.save();
    if (app.visualEffects && !app.reducedMotion && app.shake > 0) ctx.translate(Math.sin(motionClock() * 91) * app.shake, Math.cos(motionClock() * 77) * app.shake * 0.55);
    drawGame();
    ctx.restore();
  }
  if (app.demoMode) drawDemoBadge();
}

// Accès pour les tests automatiques (captures d'écran).
window.prismSmash = {app, engine, beginNewGame, openHighScores, startDemo, render, resize,
  setScreen(name) { st.screen = name; app.lastScreen = name; }};

document.documentElement.lang = app.language;
resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
